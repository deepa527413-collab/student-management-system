<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>🎓 Student Management System</h1>
</header>

<main class="container">

  <!-- Add / Edit Form -->
  <section class="card form-card">
    <h2 id="form-title">Add New Student</h2>
    <form id="student-form" novalidate>
      <input type="hidden" id="student-id">

      <div class="form-row">
        <label for="roll_number">Roll Number *</label>
        <input type="text" id="roll_number" required>
        <span class="error-text" id="err-roll_number"></span>
      </div>

      <div class="form-row">
        <label for="name">Full Name *</label>
        <input type="text" id="name" required>
        <span class="error-text" id="err-name"></span>
      </div>

      <div class="form-row">
        <label for="email">Email *</label>
        <input type="email" id="email" required>
        <span class="error-text" id="err-email"></span>
      </div>

      <div class="form-row">
        <label for="phone">Phone</label>
        <input type="text" id="phone" placeholder="+919876543210">
        <span class="error-text" id="err-phone"></span>
      </div>

      <div class="form-row">
        <label for="department">Department</label>
        <select id="department">
          <option value="CSE">Computer Science</option>
          <option value="ECE">Electronics & Communication</option>
          <option value="MECH">Mechanical</option>
          <option value="CIVIL">Civil</option>
          <option value="EEE">Electrical & Electronics</option>
          <option value="IT">Information Technology</option>
          <option value="OTHER">Other</option>
        </select>
      </div>

      <div class="form-row">
        <label for="year">Year *</label>
        <input type="number" id="year" min="1" max="6" required>
        <span class="error-text" id="err-year"></span>
      </div>

      <div class="form-actions">
        <button type="submit" id="submit-btn" class="btn btn-primary">Add Student</button>
        <button type="button" id="cancel-btn" class="btn btn-secondary" style="display:none;">Cancel</button>
      </div>

      <p id="form-message" class="form-message"></p>
    </form>
  </section>

  <!-- List + Search -->
  <section class="card list-card">
    <div class="list-header">
      <h2>Students</h2>
      <div class="toolbar">
        <input type="text" id="search-box" placeholder="Search by name, roll no, or email...">
        <select id="filter-department">
          <option value="">All Departments</option>
          <option value="CSE">CSE</option>
          <option value="ECE">ECE</option>
          <option value="MECH">MECH</option>
          <option value="CIVIL">CIVIL</option>
          <option value="EEE">EEE</option>
          <option value="IT">IT</option>
          <option value="OTHER">Other</option>
        </select>
        <button id="refresh-btn" class="btn btn-secondary">Refresh</button>
      </div>
    </div>

    <div id="status-message" class="status-message"></div>

    <div class="table-wrapper">
      <table id="students-table">
        <thead>
          <tr>
            <th>Roll No.</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Dept.</th>
            <th>Year</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="students-tbody">
          <!-- rows injected by script.js -->
        </tbody>
      </table>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
